        function renderLogs(data) {
            const logs = data.logs || [];
            if (logs.length === 0) {
                document.getElementById('logs').innerHTML = `<div class="empty-state"><div class="empty-state-icon">📝</div><div>${t('noLogs')}</div><div style="margin-top:0.5rem;font-size:0.85rem;">${t('noLogsHint')}</div></div>`;
                return;
            }

            const html = `
                <div class="filter-bar">
                    <span class="filter-label">${t('filterLevel')}</span>
                    <select id="logLevelFilter" onchange="filterLogs()">
                        <option value="all">${t('levelAll')}</option>
                        <option value="error">${t('levelError')}</option>
                        <option value="warning">${t('levelWarning')}</option>
                        <option value="info">${t('levelInfo')}</option>
                    </select>
                    <input type="text" id="logSearch" placeholder="${t('searchLogs')}" oninput="filterLogs()">
                    <button class="btn" onclick="loadLogs()">${t('btnRefresh')}</button>
                </div>
                <div class="panel">
                    <div class="panel-title">${t('logsTitle')} <span style="font-weight:400;font-size:0.85rem;color:#8b92a8;">(${logs.length} ${t('logsLines')} ${data.total_files || 0} ${t('logsFiles')})</span></div>
                    <div class="log-viewer scroll-style" id="logViewer"></div>
                </div>
            `;
            document.getElementById('logs').innerHTML = html;
            window.logsData = logs;
            filterLogs();
        }

        function filterLogs() {
            const levelFilter = document.getElementById('logLevelFilter')?.value || 'all';
            const search = document.getElementById('logSearch')?.value.toLowerCase() || '';

            let filtered = window.logsData || [];
            if (levelFilter !== 'all') filtered = filtered.filter(l => l.level.toLowerCase() === levelFilter);
            if (search) filtered = filtered.filter(l => l.message.toLowerCase().includes(search) || l.source.toLowerCase().includes(search));

            const logHTML = filtered.map(l => `
                <div class="log-line">
                    <span class="log-ts">${l.timestamp || ''}</span>
                    <span class="log-level ${l.level}">${l.level}</span>
                    <span class="log-src">${l.source}</span>
                    <span class="log-msg">${l.message}</span>
                </div>
            `).join('');
            const viewer = document.getElementById('logViewer');
            if (viewer) {
                viewer.innerHTML = logHTML || `<div style="padding:2rem;text-align:center;color:#64748b;">${t('noLogsMatch')}</div>`;
                viewer.scrollTop = viewer.scrollHeight; // Auto-scroll to bottom
            }
        }

                        <div class="config-item"><span class="config-key">${t('cfgLastBrokerEquity')}</span><span class="config-value">${accountState.last_broker_equity ? formatCurrency(accountState.last_broker_equity) : 'N/A'}</span></div>
                        <div class="config-item"><span class="config-key">${t('cfgLastPostTradeEquity')}</span><span class="config-value">${accountState.last_post_trade_equity ? formatCurrency(accountState.last_post_trade_equity) : 'N/A'}</span></div>
                    </div>
                </div>
                ${config.scheduler_command ? `<div class="panel">
                    <div class="panel-title">${t('settingsSchedulerTitle')}</div>
                    <pre style="background:#050917;padding:1rem;border-radius:6px;overflow-x:auto;font-size:0.75rem;color:#cbd5e1;">${config.scheduler_command}</pre>
                </div>` : ''}
            `;
            document.getElementById('settings').innerHTML = html;
        }

                // === SSE (Server-Sent Events) ===
        function connectSSE() {
            if (sseConnection) {
                try { sseConnection.close(); } catch (e) {}
            }

            sseConnection = new EventSource('/api/stream');
            const connStatus = document.getElementById('connStatus');

            sseConnection.onopen = () => {
                connStatus.textContent = t('connLive');
                connStatus.classList.remove('disconnected');
            };

            sseConnection.onerror = () => {
                connStatus.textContent = t('connDisconnected');
                connStatus.classList.add('disconnected');
                // Auto-reconnect after 5s
                setTimeout(() => {
                    if (sseConnection.readyState === EventSource.CLOSED) {
                        connectSSE();
                    }
                }, 5000);
            };

            sseConnection.onmessage = (event) => {
                try {
                    const data = JSON.parse(event.data);
                    if (data.event === 'artifacts_changed') {
                        console.log('[SSE] Artifacts changed:', data.changed);
                        // Reload current tab data
                        loadTabData(currentTab);
                    } else if (data.event === 'heartbeat') {
                        // Keep-alive, no action needed
                    } else if (data.event === 'connected') {
                        console.log('[SSE] Connected');
                    }
                } catch (err) {
                    console.error('[SSE] Parse error:', err);
                }
            };
        }

        // === INITIALIZATION ===
        function init() {
            updateLanguage(); // Apply language on load
            loadOverview();
            connectSSE();

            window.addEventListener('resize', () => {
                if (currentTab === 'execution-timeline' && executionTimelineState.data) {
                    renderExecutionTimeline();
                }
            });

            // Auto-refresh fallback (SSE primary, polling backup)
            setInterval(() => {
                const now = Date.now();
                if (now - lastUpdateTime > 45000) { // No update for 45s
                    loadTabData(currentTab);
                }
            }, 30000);
        }

        // Start
        if (document.readyState === 'loading') {
            document.addEventListener('DOMContentLoaded', init);
        } else {
            init();
        }

    </script>
</body>
